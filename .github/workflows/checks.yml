name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check whitespace
        run: git show --format= --check HEAD
      - name: Keep local artifacts out of Git
        shell: bash
        run: |
          blocked=$(git ls-files | grep -Ei '(^DataNew/|^data/|^outputs/|^plan_action/|(^|/)\.env($|\.)|\.(pt|pth|ckpt|safetensors|pem|key|docx)$)' || true)
          if [ -n "$blocked" ]; then
            echo 'Local datasets, checkpoints, credentials or course documents must not be tracked.'
            exit 1
          fi
      - name: Check required files and JSON evidence
        shell: bash
        run: |
          test -f train.py
          test -f evaluate.py
          test -f LICENSE
          test -f requirements.txt
          git ls-files -z '*.json' | while IFS= read -r -d '' path; do jq empty "$path"; done
